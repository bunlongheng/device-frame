<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2d33"/>
      <stop offset="1" stop-color="#101015"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb15c"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7e8ec"/>
      <stop offset="0.5" stop-color="#a9abb1"/>
      <stop offset="1" stop-color="#d2d3d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#ff9d4d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff9d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle background -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#glow)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- phone body (titanium rail) - slim, tall -->
  <rect x="45" y="18" width="38" height="92" rx="13" fill="url(#rail)"/>
  <rect x="45" y="18" width="38" height="92" rx="13" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
  <!-- screen -->
  <rect x="48.5" y="21.5" width="31" height="85" rx="10" fill="#0e0f13"/>

  <!-- dynamic island -->
  <rect x="58" y="25.5" width="12" height="4.5" rx="2.25" fill="#000"/>

  <!-- abstract page inside the screen, amber -->
  <rect x="52" y="37" width="24" height="9" rx="2.6" fill="url(#amber)"/>
  <rect x="52" y="51" width="24" height="3.2" rx="1.6" fill="#ff9d4d" opacity="0.85"/>
  <rect x="52" y="57.5" width="18" height="3.2" rx="1.6" fill="#ff9d4d" opacity="0.6"/>
  <rect x="52" y="64" width="21" height="3.2" rx="1.6" fill="#ff9d4d" opacity="0.45"/>
  <rect x="52" y="70.5" width="15" height="3.2" rx="1.6" fill="#ff9d4d" opacity="0.35"/>
  <!-- home indicator -->
  <rect x="56.5" y="99" width="15" height="2.6" rx="1.3" fill="#ffffff" opacity="0.5"/>
</svg>
