<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2c31"/>
      <stop offset="1" stop-color="#131318"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb15c"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- phone body -->
  <rect x="42" y="24" width="44" height="80" rx="12" fill="none" stroke="url(#amber)" stroke-width="5"/>
  <!-- screen -->
  <rect x="49" y="31" width="30" height="66" rx="6" fill="url(#amber)" opacity="0.16"/>
  <!-- dynamic island -->
  <rect x="56" y="35" width="16" height="5" rx="2.5" fill="url(#amber)"/>
</svg>
